name: Validar sincronização TikTok para Blob
on:
  push:
    paths:
      - '.github/workflows/install-sync.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install 'fflate@^0.8.2' --save
      - name: Validar produção
        run: npm run build
        env:
          SESSION_SECRET: "test_secret_minimum_32_characters_123456"
          STUDIO_PASSWORD: "password-for-build-only"
      - name: Registrar dependência
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: adicionar leitor ZIP para sincronizar MP4"
            git push
          fi
