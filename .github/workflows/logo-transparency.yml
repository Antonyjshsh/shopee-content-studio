name: Corrigir transparencia da logo NFC
on:
  push:
    paths:
      - 'scripts/remove_logo_background.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/remove_logo_background.py
      - name: Commitar PNG transparente
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/logo-nfc-orange.png
          if ! git diff --cached --quiet; then
            git commit -m "fix: aplicar transparencia real na logo NFC"
            git push
          fi
