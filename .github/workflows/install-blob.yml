name: Instalar biblioteca Vercel Blob
on:
  push:
    paths:
      - '.github/workflows/install-blob.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Atualizar dependencias
        run: npm install '@vercel/blob@^2.3.0' --save
      - name: Validar build
        run: npm run build
        env:
          SESSION_SECRET: "test_secret_minimum_32_characters_123456"
          STUDIO_PASSWORD: "password-for-build-only"
      - name: Commitar dependencias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: instalar Vercel Blob e validar aplicação"
            git push
          fi
